  <!-- AUDIO GENERATION AND BACKGROUND SOUNDS -->
  <script>
    let audioContext = null;
    let oscillators = [];
    let soundEnabled = true;

    // Initialize Audio Context
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Create Binaural Beats
    function playBinauralBeats() {
      if (!soundEnabled || !audioContext) return;
      
      initAudio();
      
      // Left ear: 200 Hz
      const osc1 = audioContext.createOscillator();
      const gain1 = audioContext.createGain();
      osc1.frequency.value = 200;
      osc1.type = 'sine';
      gain1.gain.value = 0.1;
      osc1.connect(gain1);
      gain1.connect(audioContext.destination);
      osc1.start();

      // Right ear: 210 Hz (10 Hz difference → 10 Hz binaural beat)
      const osc2 = audioContext.createOscillator();
      const gain2 = audioContext.createGain();
      osc2.frequency.value = 210;
      osc2.type = 'sine';
      gain2.gain.value = 0.1;
      osc2.connect(gain2);
      gain2.connect(audioContext.destination);
      osc2.start();

      oscillators.push(osc1, osc2);

      // Stop after 30 seconds and loop
      setTimeout(() => {
        osc1.stop();
        osc2.stop();
        oscillators = oscillators.filter(o => o !== osc1 && o !== osc2);
        if (soundEnabled) {
          setTimeout(playBinauralBeats, 500);
        }
      }, 30000);
    }

    // Create Waterfall Ambience Sounds
    function playWaterfallSounds() {
      if (!soundEnabled || !audioContext) return;

      initAudio();

      // Create flowing waterfall sound with deeper frequencies
      for (let i = 0; i < 6; i++) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const lfo = audioContext.createOscillator();
        const lfoGain = audioContext.createGain();

        // Waterfall frequencies - deeper and more melodic
        osc.frequency.value = 40 + Math.random() * 150;
        osc.type = 'triangle';

        // LFO modulation for natural variation
        lfo.frequency.value = 0.3 + Math.random() * 1.2;
        lfoGain.gain.value = 25;
        
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        gain.gain.setValueAtTime(0.06, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.025, audioContext.currentTime + 18);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + 18);

        oscillators.push(osc);
      }

      // Loop waterfall sounds
      if (soundEnabled) {
        setTimeout(playWaterfallSounds, 17000);
      }
    }

    // Initialize on Page Load - Auto start sounds
    window.addEventListener('click', () => {
      initAudio();
      if (soundEnabled) {
        playBinauralBeats();
        playWaterfallSounds();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        initAudio();
        if (soundEnabled) {
          playBinauralBeats();
          playWaterfallSounds();
        }
      }, 500);
    });
  </script>
