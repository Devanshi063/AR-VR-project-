<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Focus Meditation</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
    }

    .controls {
        position: fixed;
        bottom: 30px;
        width: 100%;
        z-index: 10; /* 👈 makes buttons above canvas */
    }

    button {
        background: #111;
        border: 1px solid white;
        color: white;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: white;
        color: black;
    }

    input[type="range"] {
        width: 200px;
    }
</style>
</head>
<body>

<canvas id="space"></canvas>

<div class="controls">
    <h2>🌌 Space Binaural Experience</h2>
    <button id="focusBtn">Focus</button>
    <button id="studyBtn">Study</button>
    <button id="relaxBtn">Relax</button>
    <br><br>
    Volume: 
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.3">
</div>

<script>
/* ---------- SPACE ANIMATION ---------- */
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5,
        speed: Math.random() * 0.5
    });
}

function drawMoon() {
    ctx.beginPath();
    ctx.arc(canvas.width - 150, 120, 60, 0, Math.PI * 2);
    ctx.fillStyle = "#ddd";
    ctx.fill();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        star.y += star.speed;
        if (star.y > canvas.height) star.y = 0;
    });

    drawMoon();
    requestAnimationFrame(animate);
}
animate();

/* ---------- BINAURAL BEATS ---------- */
let audioCtx;
let oscillatorLeft, oscillatorRight;
let gainNode;

function startAudio(baseFreq, beatFreq) {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (oscillatorLeft) oscillatorLeft.stop();
    if (oscillatorRight) oscillatorRight.stop();

    oscillatorLeft = audioCtx.createOscillator();
    oscillatorRight = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();

    const merger = audioCtx.createChannelMerger(2);

    oscillatorLeft.frequency.value = baseFreq;
    oscillatorRight.frequency.value = baseFreq + beatFreq;

    oscillatorLeft.connect(merger, 0, 0);
    oscillatorRight.connect(merger, 0, 1);
    merger.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    gainNode.gain.value = 0.3;

    oscillatorLeft.start();
    oscillatorRight.start();
}

// Button event listeners (better than inline onclick)
document.getElementById("focusBtn").addEventListener("click", () => {
    startAudio(220, 14); // Beta
});

document.getElementById("studyBtn").addEventListener("click", () => {
    startAudio(200, 10); // Alpha
});

document.getElementById("relaxBtn").addEventListener("click", () => {
    startAudio(180, 6); // Theta
});

// Volume control
document.getElementById("volumeSlider").addEventListener("input", (e) => {
    if (gainNode) {
        gainNode.gain.value = e.target.value;
    }
});
</script>

</body>
</html>
